name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: citadent
          POSTGRES_PASSWORD: citadent_dev
          POSTGRES_DB: citadent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U citadent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10